name: Evolve the architecture atlas
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify proposed changes without pushing commits, PRs, or Pages
        type: boolean
        default: false
      force:
        description: Scan inside the normal frequency window
        type: boolean
        default: false
concurrency:
  group: pages-publication
  cancel-in-progress: false
permissions: {}
jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      review: ${{ steps.queue.outputs.review }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Incremental public GitHub scan
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          if [[ "$(node -p "require('./config/automation.json').enabled")" != true ]]; then exit 0; fi
          if [[ "$FORCE" == true ]]; then npm run sync -- --force; else npm run sync; fi
      - name: Analyze routine architecture changes if configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARCHITECTURE_MODEL: ${{ vars.ARCHITECTURE_MODEL }}
        run: |
          if [[ -n "$OPENAI_API_KEY" && "$(node -p "require('./config/automation.json').autoPublishArchitecture")" == true ]]; then
            npm run analyze -- --apply
          fi
      - name: Check whether there are review candidates
        id: queue
        run: |
          if [[ "$(node -p "require('./config/automation.json').enabled && require('./config/discovery.json').pending.length > 0")" == true ]]; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify changed public data
        id: verify
        run: |
          if git diff --quiet -- config/discovery.json projects; then exit 0; fi
          npm run check
          npm test
          npm run evidence
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        if: steps.verify.outputs.changed == 'true' && !inputs.dry_run
        with:
          path: dist
      - name: Commit verified updates
        id: publish
        if: steps.verify.outputs.changed == 'true' && !inputs.dry_run
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/discovery.json projects/*.json
          git commit -m "Sync verified GitHub contribution and architecture evidence"
          git push origin HEAD:main
          echo "publish=true" >> "$GITHUB_OUTPUT"
  deploy:
    needs: sync
    if: needs.sync.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
  review:
    needs: sync
    if: needs.sync.outputs.review == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare review candidate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARCHITECTURE_MODEL: ${{ vars.ARCHITECTURE_MODEL }}
        run: |
          export REVIEW_ID="$(node -e 'const c=require("./config/discovery.json"); console.log(require("node:crypto").createHash("sha256").update(JSON.stringify(c.pending)).digest("hex").slice(0,12))')"
          echo "REVIEW_ID=$REVIEW_ID" >> "$GITHUB_ENV"
          mkdir -p reviews
          if [[ -n "$OPENAI_API_KEY" ]]; then
            node automation/review-report.mjs --has-model > "reviews/$REVIEW_ID.md"
            npm run analyze -- --review --apply
          else

            node automation/review-report.mjs > "reviews/$REVIEW_ID.md"
          fi
          npm run check
          npm test
          npm run evidence
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Open draft for independent review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$(git status --porcelain -- config/discovery.json projects reviews)" ]]; then exit 0; fi
          branch="automation/review-$REVIEW_ID"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then exit 0; fi
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- config/discovery.json projects/*.json
          if [[ -d reviews ]]; then git add -- reviews; fi
          git commit -m "Propose architecture evidence for review"
          git push origin "$branch"
          gh pr create --draft --base main --head "$branch" --title "Review architecture evidence $REVIEW_ID" --body "Check the immutable upstream evidence and review any proposed scene before merging. This draft does not deploy the changes."
